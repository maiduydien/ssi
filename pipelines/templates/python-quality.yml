parameters:
  - name: pythonVersion
    type: string
    default: '3.11'

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: ${{ parameters.pythonVersion }}
  - script: |
      python -m pip install --upgrade pip
      pip install -r requirements-dev.txt
    displayName: Install Python dependencies
  - script: |
      ruff check app/data app/engines app/services app/config.py app/main.py tests
    displayName: Ruff lint (new modules)
  - script: |
      pytest --junitxml=junit.xml --cov=app --cov-report=xml --cov-report=term-missing
    displayName: Run automated tests
  - task: PublishTestResults@2
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: 'junit.xml'
      failTaskOnFailedTests: true
  - script: pip-audit -r requirements.txt
    displayName: Dependency vulnerability audit
