name: CI-CD Dev

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      deploy_dev:
        description: 'Deploy to Dev (run Terraform Plan, then require approval before Apply)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

# Serialize runs on the same branch so two Terraform deployments do not race.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: '1.9.8'
  TF_DIR: infra/terraform/environments/dev
  ACR_REPOSITORY: lssiv01

jobs:
  quality-and-image:
    name: Python checks + Docker build/scan + ACR publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app/data app/engines app/services app/config.py app/main.py tests

      - name: Tests
        run: pytest --junitxml=junit.xml --cov=app --cov-report=xml --cov-report=term-missing

      - name: Dependency audit
        run: pip-audit -r requirements.txt

      - name: Build Docker image
        env:
          LOCAL_IMAGE: ssi-v57-platform:${{ github.sha }}
        run: |
          docker build --pull \
            --build-arg APP_VERSION="${GITHUB_RUN_NUMBER}" \
            --build-arg GIT_SHA="${GITHUB_SHA}" \
            -t "$LOCAL_IMAGE" .

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ssi-v57-platform:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      # Publish only for pushes to develop, or an explicitly requested Dev deployment.
      # PRs and main-branch pushes run CI but do not publish/deploy.
      - name: Azure Login (OIDC)
        if: >-
          github.ref == 'refs/heads/develop' &&
          (github.event_name == 'push' ||
           (github.event_name == 'workflow_dispatch' && inputs.deploy_dev == true))
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Push immutable image to ACR
        if: >-
          github.ref == 'refs/heads/develop' &&
          (github.event_name == 'push' ||
           (github.event_name == 'workflow_dispatch' && inputs.deploy_dev == true))
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
          LOCAL_IMAGE: ssi-v57-platform:${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$ACR_NAME"
          test -n "$ACR_LOGIN_SERVER"
          az acr login --name "$ACR_NAME"
          IMAGE="$ACR_LOGIN_SERVER/$ACR_REPOSITORY:$GITHUB_SHA"
          docker tag "$LOCAL_IMAGE" "$IMAGE"
          docker push "$IMAGE"
          echo "Published immutable image: $IMAGE"

  terraform-validate:
    name: Terraform validate + Checkov
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Validate Terraform roots (no Azure apply)
        shell: bash
        run: |
          set -euo pipefail
          for envdir in \
            infra/terraform/environments/shared \
            infra/terraform/environments/dev \
            infra/terraform/environments/staging \
            infra/terraform/environments/prod \
            infra/terraform/targets/app_service \
            infra/terraform/targets/aks; do
            terraform -chdir="$envdir" init -backend=false -input=false
            terraform -chdir="$envdir" validate
          done

      - name: Scan Terraform configuration
        run: |
          python -m pip install --upgrade checkov
          checkov -d infra/terraform --framework terraform --soft-fail

  terraform-plan:
    name: Terraform Plan (Dev)
    if: >-
      github.ref == 'refs/heads/develop' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.deploy_dev == true))
    needs: [quality-and-image, terraform-validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: 'true'
      ARM_USE_AZUREAD: 'true'
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}