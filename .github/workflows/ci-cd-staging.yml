name: CI-CD Staging

# Deploy manually from develop after CI-CD Dev has published the immutable SHA image.
on:
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: "Deploy this commit to Staging (Plan, approval, Apply, smoke test)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-cd-staging
  cancel-in-progress: false

env:
  TF_VERSION: "1.9.8"
  TF_DIR: infra/terraform/environments/staging
  ACR_REPOSITORY: lssiv01

jobs:
  terraform-validate:
    name: Terraform validate + Checkov
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Validate Staging Terraform (no Azure apply)
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="$TF_DIR" init -backend=false -input=false
          terraform -chdir="$TF_DIR" validate

      - name: Scan Terraform configuration
        run: |
          python -m pip install --upgrade checkov
          checkov -d infra/terraform --framework terraform --soft-fail

  terraform-plan:
    name: Terraform Plan (Staging)
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/develop' &&
      inputs.deploy_staging == true
    needs: terraform-validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
      TFSTATE_STORAGE_ACCOUNT_NAME: ${{ vars.TFSTATE_STORAGE_ACCOUNT_NAME }}
      TFSTATE_CONTAINER_NAME: ${{ vars.TFSTATE_CONTAINER_NAME }}
      TFSTATE_KEY_STAGING: ${{ vars.TFSTATE_KEY_STAGING }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify dispatch branch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/develop" ]] || {
            echo "::error::Please dispatch this workflow from develop."
            exit 1
          }

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify immutable image exists in ACR
        shell: bash
        env:
          IMAGE: ${{ vars.ACR_LOGIN_SERVER }}/lssiv01:${{ github.sha }}
        run: |
          set -euo pipefail
          : "${ACR_NAME:?Missing GitHub variable ACR_NAME}"
          : "${ACR_LOGIN_SERVER:?Missing GitHub variable ACR_LOGIN_SERVER}"
          az acr repository show             --name "$ACR_NAME"             --image "$ACR_REPOSITORY:$GITHUB_SHA"             --output none
          echo "Verified image: $IMAGE"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Initialize existing remote Staging State (OIDC)
        shell: bash
        run: |
          set -euo pipefail
          : "${TFSTATE_RESOURCE_GROUP:?Missing TFSTATE_RESOURCE_GROUP}"
          : "${TFSTATE_STORAGE_ACCOUNT_NAME:?Missing TFSTATE_STORAGE_ACCOUNT_NAME}"
          : "${TFSTATE_CONTAINER_NAME:?Missing TFSTATE_CONTAINER_NAME}"
          : "${TFSTATE_KEY_STAGING:?Missing TFSTATE_KEY_STAGING}"

          [[ "$TFSTATE_KEY_STAGING" == "vn30f1m/staging.tfstate" ]] || {
            echo "::error::Unexpected Staging state key: $TFSTATE_KEY_STAGING"
            exit 1
          }

          terraform -chdir="$TF_DIR" init -input=false             -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP"             -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT_NAME"             -backend-config="container_name=$TFSTATE_CONTAINER_NAME"             -backend-config="key=$TFSTATE_KEY_STAGING"             -backend-config="use_oidc=true"             -backend-config="use_azuread_auth=true"             -backend-config="tenant_id=$ARM_TENANT_ID"             -backend-config="subscription_id=$ARM_SUBSCRIPTION_ID"

      - name: Verify expected Staging State
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="$TF_DIR" state list | tee state-addresses.txt

          for address in             'azurerm_resource_group.this'             'azurerm_user_assigned_identity.container_app'             'azurerm_role_assignment.container_app_acr_pull'; do
            grep -Fxq "$address" state-addresses.txt || {
              echo "::error::Expected Staging state address missing: $address"
              exit 1
            }
          done

      - name: Terraform Plan (Staging)
        shell: bash
        env:
          IMAGE: ${{ vars.ACR_LOGIN_SERVER }}/lssiv01:${{ github.sha }}
        run: |
          set -euo pipefail
          terraform -chdir="$TF_DIR" plan -input=false -lock-timeout=5m             -var="container_image=$IMAGE"             -out=tfplan

          terraform -chdir="$TF_DIR" show -no-color tfplan > "$TF_DIR/tfplan-review.txt"
          terraform -chdir="$TF_DIR" show -json tfplan > "$TF_DIR/tfplan.json"

          python - "$TF_DIR/tfplan.json" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              plan = json.load(f)

          changes = plan.get("resource_changes") or []
          destructive = [
              item for item in changes
              if "delete" in (item.get("change", {}).get("actions") or [])
          ]

          if destructive:
              print("::error::Terraform Staging plan includes delete/replacement actions; refusing automatic deployment.")
              for item in destructive:
                  print(f" - {item.get('address')}: {item.get('change', {}).get('actions')}")
              sys.exit(1)

          counts = {"create": 0, "update": 0, "delete": 0, "no-op": 0}
          for item in changes:
              actions = item.get("change", {}).get("actions") or []
              if actions == ["create"]:
                  counts["create"] += 1
              elif actions == ["update"]:
                  counts["update"] += 1
              elif actions == ["delete"]:
                  counts["delete"] += 1
              elif actions == ["no-op"]:
                  counts["no-op"] += 1

          summary = "Terraform Staging Plan: " + ", ".join(
              f"{key}={value}" for key, value in counts.items()
          )
          print(summary)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("## Terraform Plan (Staging)\n\n")
              f.write(summary + "\n\n")
              f.write(f"Image: `{os.environ['IMAGE']}`\n\n")
              f.write("The review file is attached as `terraform-plan-staging`.\n")
          PY

          rm -f "$TF_DIR/tfplan.json"

      - name: Upload reviewed Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-staging
          path: |
            infra/terraform/environments/staging/tfplan
            infra/terraform/environments/staging/tfplan-review.txt
          retention-days: 1
          if-no-files-found: error

  terraform-apply:
    name: Approval + Terraform Apply (Staging)
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/develop' &&
      inputs.deploy_staging == true
    needs: terraform-plan
    runs-on: ubuntu-latest

    # Add required reviewers under GitHub Settings > Environments > staging.
    environment:
      name: staging
      url: https://ca-vn30f1m-staging.bravewave-4c45f0c3.southeastasia.azurecontainerapps.io

    permissions:
      contents: read
      id-token: write

    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
      TFSTATE_STORAGE_ACCOUNT_NAME: ${{ vars.TFSTATE_STORAGE_ACCOUNT_NAME }}
      TFSTATE_CONTAINER_NAME: ${{ vars.TFSTATE_CONTAINER_NAME }}
      TFSTATE_KEY_STAGING: ${{ vars.TFSTATE_KEY_STAGING }}

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download reviewed Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-staging
          path: infra/terraform/environments/staging

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Initialize same remote Staging State
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="$TF_DIR" init -input=false             -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP"             -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT_NAME"             -backend-config="container_name=$TFSTATE_CONTAINER_NAME"             -backend-config="key=$TFSTATE_KEY_STAGING"             -backend-config="use_oidc=true"             -backend-config="use_azuread_auth=true"             -backend-config="tenant_id=$ARM_TENANT_ID"             -backend-config="subscription_id=$ARM_SUBSCRIPTION_ID"

      - name: Verify Staging State before Apply
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="$TF_DIR" state list | tee state-addresses.txt
          grep -Fxq 'azurerm_resource_group.this' state-addresses.txt || {
            echo "::error::Expected Staging Resource Group is missing from State."
            exit 1
          }

      - name: Apply exact reviewed plan
        run: terraform -chdir="$TF_DIR" apply -input=false -lock-timeout=5m tfplan

      - name: Verify Staging Container App and smoke test
        shell: bash
        run: |
          set -euo pipefail

          az containerapp show             --name ca-vn30f1m-staging             --resource-group rg-vn30f1m-staging             --query "{name:name,state:properties.provisioningState,environment:properties.managedEnvironmentId}"             --output json

          REVISION="$(az containerapp revision list             --name ca-vn30f1m-staging             --resource-group rg-vn30f1m-staging             --query "sort_by([?properties.active==\`true\`], &properties.createdTime)[-1].name"             --output tsv)"

          [[ -n "$REVISION" ]] || {
            echo "::error::No active Staging revision found."
            exit 1
          }

          FQDN="$(az containerapp revision show             --name ca-vn30f1m-staging             --resource-group rg-vn30f1m-staging             --revision "$REVISION"             --query properties.fqdn             --output tsv)"

          [[ -n "$FQDN" ]] || {
            echo "::error::Could not get FQDN for active Staging revision."
            exit 1
          }

          APP_URL="https://$FQDN"
          echo "Revision: $REVISION"
          echo "URL: $APP_URL"

          for endpoint in health ready version; do
            echo "Checking /$endpoint"
            curl --fail --silent --show-error               --retry 15 --retry-delay 10 --retry-connrefused               "$APP_URL/$endpoint"
            echo
          done

          curl --fail --silent --show-error "$APP_URL/version" |
            python -c '
          import json, sys, os
          version = json.load(sys.stdin)
          expected = os.environ["GITHUB_SHA"]
          actual = version.get("commit")
          print("Expected commit:", expected)
          print("Actual commit:  ", actual)
          assert actual == expected, f"Expected commit {expected}, got {actual}"
          '

      - name: Staging deployment summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Staging deployment succeeded"
            echo
            echo "- Branch: \`develop\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Image: \`${{ vars.ACR_LOGIN_SERVER }}/lssiv01:$GITHUB_SHA\`"
            echo "- App: https://ca-vn30f1m-staging.bravewave-4c45f0c3.southeastasia.azurecontainerapps.io"
            echo "- Smoke tests: \`/health\`, \`/ready\`, \`/version\`"
          } >> "$GITHUB_STEP_SUMMARY"
