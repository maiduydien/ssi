
name: Azure OIDC Branch Authentication Test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  azure-login:
    name: Test Azure OIDC Login - develop
    runs-on: ubuntu-latest

    # Chỉ cho phép chạy từ nhánh develop
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure using branch OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure account
        shell: bash
        run: |
          az account show \
            --query "{name:name, subscriptionId:id, tenantId:tenantId}" \
            --output table

      - name: Verify Azure access token
        shell: bash
        run: |
          az account get-access-token \
            --query "{tokenType:tokenType, expiresOn:expiresOn}" \
            --output table
