name: Azure OIDC Authentication Test

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - ".github/workflows/azure-oidc-test.yml"

permissions:
  contents: read
  id-token: write

jobs:
  azure-login:
    name: Test Azure OIDC Login
    runs-on: ubuntu-latest

    # Must match the Azure Federated Credential subject
    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure account
        shell: bash
        run: |
          az account show \
            --query "{name:name, subscriptionId:id, tenantId:tenantId}" \
            --output table

      - name: Verify Azure identity
        shell: bash
        run: |
          az account get-access-token \
            --query "{tokenType:tokenType, expiresOn:expiresOn}" \
            --output table